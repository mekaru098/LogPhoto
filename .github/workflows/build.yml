name: Build (unsigned, compile check)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project LogPhoto.xcodeproj \
            -scheme LogPhoto \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee build.log
      # ビルドエラーをコミットのコメントに書き出す（Actions のログは外部ストレージで読めない環境向け）
      - name: Report compile errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERRORS=$(grep -E "error:|warning: .*never used" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -60)
          BODY=$(printf 'Build failed (run %s)\n\n```\n%s\n```' "${{ github.run_id }}" "$ERRORS")
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" >/dev/null
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/LogPhoto.app" Payload/
          zip -r LogPhoto.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogPhoto-ipa
          path: LogPhoto.ipa
      # サイドロード用: ビルドごとに GitHub Release へも IPA を置く。
      # 最新版は常に https://github.com/mekaru098/LogPhoto/releases/latest/download/LogPhoto.ipa
      - name: Publish IPA to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml | head -1)
          TAG="v${VERSION}-build${{ github.run_number }}"
          cp LogPhoto.ipa "LogPhoto-${TAG}.ipa"
          gh release create "$TAG" LogPhoto.ipa "LogPhoto-${TAG}.ipa" \
            --title "LogPhoto ${TAG}" \
            --notes "Unsigned IPA for sideloading. Commit ${{ github.sha }}" \
            --latest

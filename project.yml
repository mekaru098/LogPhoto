name: LogPhoto
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
targets:
  LogPhoto:
    type: application
    platform: iOS
    sources:
      - LogPhotoApp.swift
      - ContentView.swift
      - CameraPreviewView.swift
      - LogPhotoCamera.swift
      - LogPhotoLUT.swift
      - Assets.xcassets
    preBuildScripts:
      - name: Decode App Icon
        script: 'base64 -D -i "$SRCROOT/AppIcon.b64" -o "$SRCROOT/Assets.xcassets/AppIcon.appiconset/AppIcon1024.png"'
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "1.12"
        CFBundleVersion: "22"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Camera is used to capture Log photos
        NSPhotoLibraryAddUsageDescription: Used to save captured Log photos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.logphoto
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.12"
        CURRENT_PROJECT_VERSION: "22"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

name: LogPhoto
options:
  bundleIdPrefix: com.hame
  deploymentTarget:
    iOS: "18.0"
targets:
  LogPhoto:
    type: application
    platform: iOS
    sources:
      - LogPhotoApp.swift
      - ContentView.swift
      - CameraPreviewView.swift
      - LogPhotoCamera.swift
      - LogPhotoLUT.swift
      - Localization.swift
      - DebugLog.swift
      - Assets.xcassets
      - PrivacyInfo.xcprivacy   # App Store 提出に必要（使う API の利用理由）
      - Localizations           # 許可ダイアログの文言（InfoPlist.strings、言語ごと）
    preBuildScripts:
      - name: Decode App Icon
        script: 'base64 -D -i "$SRCROOT/AppIcon.b64" -o "$SRCROOT/Assets.xcassets/AppIcon.appiconset/AppIcon1024.png"'
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "1.20"
        CFBundleVersion: "32"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 許可文の既定値（英語）。各言語の文言は Localizations/*.lproj/InfoPlist.strings
        NSCameraUsageDescription: LogPhoto uses the camera to take Log and RAW photos.
        NSPhotoLibraryAddUsageDescription: LogPhoto saves the photos you take to your photo library.
        # 通信も暗号化も使わないので、提出ごとの輸出規制の質問を省く
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # App Store Connect に登録する ID（一度登録すると変えられない）
        PRODUCT_BUNDLE_IDENTIFIER: com.hame.logphoto
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.20"
        CURRENT_PROJECT_VERSION: "32"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

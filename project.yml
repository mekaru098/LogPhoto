name: LogPhoto
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
targets:
  LogPhoto:
    type: application
    platform: iOS
    sources:
      - LogPhotoApp.swift
      - ContentView.swift
      - CameraPreviewView.swift
      - LogPhotoCamera.swift
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Camera is used to capture Log photos
        NSPhotoLibraryAddUsageDescription: Used to save captured Log photos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.logphoto
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
